<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JUNE BRATS ★ Find Your Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Pacifico&family=Rubik+Bubbles&display=swap" rel="stylesheet" />
  <style>
    :root {
      --hot: #ff2d95;
      --bubble: #ff8ec8;
      --baby: #ffd0e6;
      --blush: #fff0f7;
      --deep: #c4186b;
      --ink: #1a0810;
      --cream: #fff7fb;
      --mint: #9dffd0;
      --lilac: #e8b4ff;
      --chrome-a: #ffffff;
      --chrome-b: #ffc1de;
      --chrome-c: #ff5fb2;
      --shadow: 4px 4px 0 #1a0810;
      --shadow-lg: 6px 6px 0 #1a0810;
      --radius: 18px;
      --safe-top: 56px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: "Outfit", system-ui, sans-serif;
      color: var(--ink);
      background: var(--ink);
    }

    /* ========== floating SVG décor layer ========== */
    .decor-layer {
      position: fixed; inset: 0; pointer-events: none !important; z-index: 5; overflow: hidden;
    }
    .decor-layer * { pointer-events: none !important; }
    .decor-layer svg.floaty {
      position: absolute;
      animation: floaty 5s ease-in-out infinite;
      opacity: 0.9;
      filter: drop-shadow(2px 2px 0 rgba(26,8,16,0.25));
    }
    .decor-layer .d1 { top: 12%; left: 4%; width: 42px; animation-delay: 0s; }
    .decor-layer .d2 { top: 22%; right: 6%; width: 36px; animation-delay: 0.8s; }
    .decor-layer .d3 { bottom: 18%; left: 8%; width: 48px; animation-delay: 1.4s; }
    .decor-layer .d4 { bottom: 28%; right: 10%; width: 34px; animation-delay: 0.4s; }
    .decor-layer .d5 { top: 48%; left: 2%; width: 28px; animation-delay: 1.1s; }
    .decor-layer .d6 { top: 62%; right: 3%; width: 40px; animation-delay: 1.8s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-12px) rotate(6deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes popIn {
      0% { transform: scale(0.7) rotate(-4deg); opacity: 0; }
      70% { transform: scale(1.05) rotate(1deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* ========== chrome / sticker type ========== */
    .chrome-text {
      font-family: "Rubik Bubbles", "Outfit", sans-serif;
      background: linear-gradient(180deg, #fff 0%, #ffe0f0 35%, #ff6bb8 55%, #fff 70%, #ff9ed0 100%);
      background-size: 100% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--ink);
      filter: drop-shadow(3px 3px 0 var(--hot));
      letter-spacing: 0.02em;
    }
    .script {
      font-family: "Pacifico", cursive;
      color: var(--hot);
      text-shadow: 2px 2px 0 #fff, 3px 3px 0 var(--ink);
    }

    /* ========== audio bar ========== */
    .audio-bar {
      position: fixed; top: 0; left: 0; right: 0; height: var(--safe-top);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      background: linear-gradient(90deg, #ff8ec8, #ffd0e6, #ff8ec8);
      background-size: 200% 100%;
      animation: shimmer 6s linear infinite;
      border-bottom: 3px solid var(--ink);
      box-shadow: 0 4px 0 rgba(255,45,149,0.35);
    }
    .audio-bar .track-pill {
      display: flex; align-items: center; gap: 8px;
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 12px 4px 8px;
      box-shadow: 2px 2px 0 var(--ink);
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
    }
    .audio-bar input[type="range"] {
      width: 90px; accent-color: var(--hot);
    }

    /* ========== screens ========== */
    .screen {
      position: absolute; inset: 0;
      display: none; flex-direction: column;
      padding-top: var(--safe-top);
      overflow: hidden;
      z-index: 20;
      pointer-events: auto;
    }
    .screen.active { display: flex; }
    .screen button, .screen .locker, #main-screen {
      position: relative;
      z-index: 30;
      pointer-events: auto;
      cursor: pointer;
    }

    /* ========== MAIN / SPLASH ========== */
    #main-screen {
      background:
        radial-gradient(ellipse at 20% 20%, #ffb8dc 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, #e8b4ff 0%, transparent 45%),
        linear-gradient(160deg, #ffe6f3 0%, #ff9ecf 40%, #ff5fb2 100%);
      align-items: center; justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: calc(var(--safe-top) + 20px) 24px 40px;
    }
    .splash-frame {
      position: relative;
      width: min(92vw, 420px);
      animation: popIn 0.7s ease-out;
    }
    .splash-sticker-bg {
      position: absolute; inset: -18px;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 28px;
      box-shadow: var(--shadow-lg), 12px 12px 0 var(--hot);
      transform: rotate(-1.5deg);
      z-index: 0;
    }
    .splash-inner {
      position: relative; z-index: 1;
      padding: 28px 20px 32px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .badge-new {
      font-size: 10px; font-weight: 800; letter-spacing: 0.18em;
      background: var(--mint); color: var(--ink);
      border: 2.5px solid var(--ink); border-radius: 999px;
      padding: 4px 12px;
      box-shadow: 2px 2px 0 var(--ink);
      animation: blink 1.4s infinite;
    }
    .logo-mark {
      width: min(78vw, 300px);
      height: auto;
    }
    .splash-tag {
      font-size: clamp(1.1rem, 4vw, 1.45rem);
      line-height: 1.2;
    }
    .splash-sub {
      font-size: 13px; font-weight: 600; color: var(--deep);
      max-width: 260px; line-height: 1.45;
    }
    .touch-cta {
      margin-top: 8px;
      font-family: "Rubik Bubbles", sans-serif;
      font-size: 1.15rem;
      color: #fff;
      -webkit-text-stroke: 1.5px var(--ink);
      text-shadow: 3px 3px 0 var(--hot);
      animation: blink 1.6s infinite;
    }
    .splash-polaroid {
      margin-top: 6px;
      background: #fff;
      border: 3px solid var(--ink);
      padding: 8px 8px 22px;
      box-shadow: var(--shadow);
      transform: rotate(3deg);
      width: 140px;
    }
    .splash-polaroid .ph {
      width: 100%; aspect-ratio: 1;
      background: linear-gradient(135deg, var(--baby), var(--lilac));
      border: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: var(--deep);
    }
    .splash-polaroid figcaption {
      font-family: "Pacifico", cursive;
      font-size: 12px; text-align: center; margin-top: 6px; color: var(--hot);
    }

    /* ========== LOCKER HALL ========== */
    #locker-screen {
      background:
        radial-gradient(circle at 15% 25%, #ffc8e8 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, #e8b4ff 0%, transparent 42%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.22) 0 18px, rgba(255,143,200,0.15) 18px 20px),
        linear-gradient(165deg, #fff0f7 0%, #ffb8dc 45%, #ff7eb9 100%);
      align-items: center;
      overflow-y: auto;
      padding-bottom: 40px;
    }
    .hall-header {
      width: min(96vw, 480px);
      margin: 16px auto 8px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .hall-title {
      font-family: "Rubik Bubbles", sans-serif;
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      color: #fff;
      -webkit-text-stroke: 1.5px var(--ink);
      text-shadow: 3px 3px 0 var(--hot);
      cursor: pointer;
    }
    .hall-chip {
      font-size: 10px; font-weight: 800; letter-spacing: 0.1em;
      background: #fff; border: 2.5px solid var(--ink);
      border-radius: 999px; padding: 6px 10px;
      box-shadow: 2px 2px 0 var(--hot);
      white-space: nowrap;
    }
    .locker-wall {
      width: min(96vw, 480px);
      margin: 8px auto 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.45), transparent 30%),
        linear-gradient(180deg, #ffd6ea, #ff9ecf 45%, #ff5fb2);
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: var(--shadow-lg), 10px 10px 0 rgba(255,45,149,0.35), inset 0 0 0 6px rgba(255,255,255,0.28);
      padding: 22px 16px 28px;
      position: relative;
    }
    .locker-wall::before {
      content: "HALLWAY ★ B-WING";
      position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      background: #fff; border: 2.5px solid var(--ink);
      font-size: 10px; font-weight: 800; letter-spacing: 0.14em;
      padding: 3px 12px; border-radius: 999px;
      box-shadow: 2px 2px 0 var(--ink);
      white-space: nowrap;
    }
    .locker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .locker {
      aspect-ratio: 0.82;
      background: linear-gradient(180deg, #ffe6f3, #ffb6d9);
      border: 3px solid var(--ink);
      border-radius: 10px 10px 6px 6px;
      box-shadow: 3px 3px 0 var(--ink);
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 8px 6px 10px;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }
    .locker:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .locker .vent {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 55%; height: 10px;
      background: repeating-linear-gradient(90deg, var(--ink) 0 3px, transparent 3px 7px);
      opacity: 0.35; border-radius: 2px;
    }
    .locker .lock-knob {
      position: absolute; top: 26px;
      width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #c0c0c0 45%, #666);
      border: 2px solid var(--ink);
    }
    .locker .chibi-slot {
      width: 70%; aspect-ratio: 1;
      margin-bottom: 4px;
      border-radius: 50%;
      border: 2.5px solid var(--ink);
      background: linear-gradient(145deg, #fff, var(--baby));
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .locker .chibi-slot img,
    .locker .chibi-slot .ph-img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .locker .name-tag {
      font-size: 10px; font-weight: 800; text-align: center;
      line-height: 1.15; max-width: 100%;
      word-break: keep-all;
    }
    .locker.club-locker {
      background: linear-gradient(180deg, #fff7ae, #ffd24a);
      grid-column: span 1;
    }
    .locker.club-locker .chibi-slot {
      background: linear-gradient(145deg, #fff, var(--mint));
      border-radius: 12px;
    }
    .locker.club-locker .name-tag {
      color: var(--deep); font-size: 11px; letter-spacing: 0.04em;
    }

    /* ========== DETAIL ========== */
    #detail-screen {
      background:
        radial-gradient(circle at 10% 20%, #ffd0e6, transparent 40%),
        radial-gradient(circle at 90% 80%, #e8b4ff, transparent 40%),
        var(--blush);
      overflow-y: auto;
      padding-bottom: 32px;
    }
    .detail-top {
      width: min(96vw, 480px);
      margin: 14px auto 0;
      display: flex; justify-content: flex-end;
    }
    .close-btn {
      font-family: "Rubik Bubbles", sans-serif;
      font-size: 0.85rem;
      background: var(--ink); color: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--hot);
    }
    .profile-card {
      width: min(92vw, 420px);
      margin: 12px auto 0;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: popIn 0.45s ease-out;
    }
    .profile-hero {
      position: relative;
      height: 260px;
      background:
        repeating-linear-gradient(45deg, #ffe6f3 0 12px, #ffd0e6 12px 24px);
      border-bottom: 4px solid var(--ink);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .profile-hero .standing-ph {
      height: 95%;
      width: auto; max-width: 70%;
      object-fit: contain;
    }
    .profile-hero .standing-ph.placeholder {
      width: 55%; height: 85%;
      background: linear-gradient(180deg, #fff, var(--bubble));
      border: 3px dashed var(--deep);
      border-radius: 16px 16px 0 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 6px;
      font-size: 12px; font-weight: 800; color: var(--deep);
      margin-bottom: 0;
    }
    .profile-body { padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 10px; }
    .profile-name {
      font-family: "Rubik Bubbles", sans-serif;
      font-size: 1.55rem;
      color: var(--hot);
      -webkit-text-stroke: 1px var(--ink);
      text-shadow: 2px 2px 0 var(--baby);
      line-height: 1.1;
    }
    .info-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .info-chip {
      font-size: 12px; font-weight: 800;
      background: var(--blush);
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 2px 2px 0 var(--bubble);
    }
    .quote-box {
      margin-top: 4px;
      background: linear-gradient(135deg, #fff7fb, #ffe6f3);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 14px;
      font-style: italic; font-size: 13px; font-weight: 600;
      line-height: 1.45;
      position: relative;
    }
    .quote-box::before {
      content: "♥";
      position: absolute; top: -10px; left: 14px;
      background: var(--hot); color: #fff;
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-style: normal; font-size: 11px;
      box-shadow: 1px 1px 0 var(--ink);
    }
    .club-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      background: var(--mint); border: 2.5px solid var(--ink);
      border-radius: 999px; padding: 5px 10px;
      box-shadow: 2px 2px 0 var(--ink);
      width: fit-content;
    }

    /* ========== CLUB QUIZ ========== */
    #club-screen {
      background:
        radial-gradient(circle at 80% 10%, #e8b4ff, transparent 35%),
        linear-gradient(180deg, #fff0f7, #ffc1de);
      overflow-y: auto;
      align-items: center;
      padding-bottom: 40px;
    }
    .club-wrap {
      width: min(92vw, 420px);
      margin: 18px auto 0;
      animation: popIn 0.4s ease-out;
    }
    .club-title-block {
      text-align: center; margin-bottom: 18px;
    }
    .club-title-block h1 {
      font-family: "Rubik Bubbles", sans-serif;
      font-size: clamp(1.4rem, 6vw, 1.9rem);
      color: #fff;
      -webkit-text-stroke: 2px var(--ink);
      text-shadow: 3px 3px 0 var(--hot);
      line-height: 1.15;
    }
    .club-title-block .script { font-size: 1rem; display: block; margin-top: 4px; }
    .progress-row {
      display: flex; gap: 6px; justify-content: center; margin: 12px 0 18px;
    }
    .progress-dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: 2px solid var(--ink);
      background: #fff;
    }
    .progress-dot.on { background: var(--hot); }
    .progress-dot.done { background: var(--mint); }
    .q-card {
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 22px;
      box-shadow: var(--shadow-lg);
      padding: 22px 18px;
      text-align: center;
    }
    .q-card .q-label {
      font-size: 10px; font-weight: 800; letter-spacing: 0.16em;
      color: var(--deep); margin-bottom: 10px;
    }
    .q-card .q-text {
      font-size: 1.15rem; font-weight: 800; line-height: 1.35;
      min-height: 72px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
    }
    .choice-btn {
      width: 100%;
      margin: 8px 0;
      padding: 16px 14px;
      font-family: "Outfit", sans-serif;
      font-size: 0.95rem; font-weight: 800;
      background: #fff;
      border: 3.5px solid var(--ink);
      border-radius: 16px;
      box-shadow: 5px 5px 0 var(--ink);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s;
      color: var(--ink);
    }
    .choice-btn:nth-child(odd) { background: linear-gradient(180deg, #fff, var(--baby)); }
    .choice-btn:nth-child(even) { background: linear-gradient(180deg, #fff, #e8d4ff); }
    .choice-btn:hover { background: var(--mint); }
    .choice-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* ========== CLUB RESULT ========== */
    .result-card {
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 24px;
      box-shadow: var(--shadow-lg), 10px 10px 0 var(--hot);
      padding: 22px 16px 26px;
      text-align: center;
      animation: popIn 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }
    .result-card .stamp {
      position: absolute; top: 14px; right: 14px;
      width: 64px; height: 64px;
      border: 3px solid var(--hot);
      border-radius: 50%;
      color: var(--hot);
      font-family: "Rubik Bubbles", sans-serif;
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      transform: rotate(18deg);
      opacity: 0.85;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-align: center;
      padding: 4px;
    }
    .result-eyebrow {
      font-size: 11px; font-weight: 800; letter-spacing: 0.18em;
      color: var(--deep); margin-bottom: 6px;
    }
    .result-club-name {
      font-family: "Rubik Bubbles", sans-serif;
      font-size: clamp(1.5rem, 6vw, 2rem);
      color: var(--hot);
      -webkit-text-stroke: 1.5px var(--ink);
      text-shadow: 3px 3px 0 var(--baby);
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .result-tagline {
      font-family: "Pacifico", cursive;
      font-size: 1rem;
      color: var(--deep);
      margin-bottom: 16px;
    }
    .result-banner {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 0 auto 18px;
      width: fit-content;
      background: linear-gradient(90deg, var(--baby), #fff, var(--lilac));
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 12px; font-weight: 700; line-height: 1.35;
      max-width: 100%;
    }
    .members-label {
      font-size: 10px; font-weight: 800; letter-spacing: 0.2em;
      margin-bottom: 10px; color: var(--ink);
    }
    .members-row {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-bottom: 18px;
    }
    .member-card {
      width: 120px;
      background: var(--blush);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 10px 8px 12px;
      box-shadow: 3px 3px 0 var(--bubble);
      animation: wiggle 3s ease-in-out infinite;
    }
    .member-card:nth-child(even) { animation-delay: 0.6s; }
    .member-card .avatar {
      width: 72px; height: 72px; margin: 0 auto 8px;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: linear-gradient(145deg, #fff, var(--bubble));
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .member-card .avatar img,
    .member-card .avatar .ph-img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .member-card .m-name {
      font-size: 12px; font-weight: 800; line-height: 1.2;
    }
    .member-card .m-role {
      font-size: 10px; font-weight: 600; color: var(--deep); margin-top: 2px;
    }
    .back-btn {
      width: 100%;
      margin-top: 4px;
      padding: 16px;
      font-family: "Rubik Bubbles", sans-serif;
      font-size: 1rem;
      color: #fff;
      background: linear-gradient(180deg, var(--hot), var(--deep));
      border: 3.5px solid var(--ink);
      border-radius: 16px;
      box-shadow: 5px 5px 0 var(--ink);
      cursor: pointer;
    }
    .back-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    /* placeholder image block */
    .ph-img {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 2px;

          return `<span class="${cls}"></span>`;
        })
        .join("");
    }

    function renderTest() {
      if (testIdx < testQs.length) {
        const q = testQs[testIdx];
        document.getElementById("q-text").innerText = q.q;
        document.getElementById("btn1").innerText = q.a[0];
        document.getElementById("btn2").innerText = q.a[1];
        renderProgress();
      } else {
        showClubResult();
      }
    }

    function answer(idx) {
      testQs[testIdx].w[idx].forEach((clubId) => {
        scores[clubId] = (scores[clubId] || 0) + 1;
      });
      testIdx++;
      renderTest();
    }

    function showClubResult() {
      const winId = Object.keys(scores).sort((a, b) => scores[b] - scores[a])[0];
      const club = clubs.find((c) => c.id === winId);
      const members = characters.filter((c) => c.clubId === winId);

      const membersHtml = members
        .map(
          (m) => `
        <div class="member-card">
          <div class="avatar">${ph(m.sdImg.replace("PLACEHOLDER:", ""))}</div>
          <div class="m-name">${m.name}</div>
          <div class="m-role">${m.role.split("·")[0].trim()}</div>
        </div>`
        )
        .join("");

      document.getElementById("progress-row").innerHTML = "";
      document.getElementById("club-container").innerHTML = `
        <div class="result-card">
          <div class="stamp">ACCEPTED<br/>★</div>
          <div class="result-eyebrow">YOUR HALLWAY CLUB IS...</div>
          <div class="result-club-name">${club.name}</div>
          <div class="result-tagline">${club.tagline}</div>
          <div class="result-banner">
            <svg width="22" height="22" viewBox="0 0 64 64"><use href="#ico-heart"/></svg>
            <span>${club.blurb}</span>
          </div>
          <div class="members-label">★ CLUB MEMBERS ★</div>
          <div class="members-row">${membersHtml}</div>
          <button class="back-btn" id="back-locker-btn" type="button">BACK TO LOCKER</button>
        </div>
      `;
      document.getElementById("back-locker-btn").addEventListener("click", () => {
        showScreen("locker-screen");
      });
    }

    document.getElementById("vol-slider").addEventListener("input", (e) => {
      bgm.volume = e.target.value;
    });

    document.getElementById("main-screen").addEventListener("click", goToLocker);
    document.getElementById("main-screen").addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") goToLocker();
    });
    document.querySelector("#detail-screen .close-btn").addEventListener("click", () => {
      showScreen("locker-screen");
    });
  </script>
</body>
</html>
